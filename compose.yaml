services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/data
    networks: [internal]
    security_opt: [no-new-privileges:true]
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy
volumes:
  app_data:
  caddy_data:
  caddy_config:
networks:
  internal:
